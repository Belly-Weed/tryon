<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ห้องลองเสื้อออนไลน์</title>
<style>
:root{--bg:#eef1f4;--ink:#1c2430;--card:#fff;--accent:#2f5d8a;--line:#d5dbe2}
@media (prefers-color-scheme:dark){:root{--bg:#151a21;--ink:#e8ecf1;--card:#1f262f;--accent:#7fb0e0;--line:#333c48}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px}
h1{margin:0;font-size:1.5rem}
main{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;width:100%;max-width:1000px}
.stage{position:relative;flex:1 1 560px;background:#000;border-radius:14px;overflow:hidden;min-height:320px}
canvas{display:block;width:100%;height:auto}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px;background:rgba(0,0,0,.55)}
aside{flex:0 1 260px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
h2{margin:0;font-size:1rem}
.row{display:flex;flex-wrap:wrap;gap:8px}
button,label.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer}
button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible,input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.sw{width:34px;height:34px;padding:0;border-radius:50%}
.sw[aria-pressed=true]{outline:3px solid var(--accent);outline-offset:2px}
input[type=file]{display:none}
small{opacity:.7}
</style>
</head>
<body>
<h1>ห้องลองเสื้อออนไลน์ <small>v3</small></h1>
<main>
  <div class="stage">
    <canvas id="c" width="960" height="720"></canvas>
    <div id="msg">กด “เปิดกล้อง” แล้วยืนให้เห็นช่วงไหล่ถึงสะโพก</div>
  </div>
  <aside>
    <button id="start" style="background:var(--accent);color:#fff;border-color:var(--accent)">เปิดกล้อง</button>
    <div>
      <h2>ทรงเสื้อ</h2>
      <div class="row" id="styles"></div>
    </div>
    <div>
      <h2>สี</h2>
      <div class="row" id="colors"></div>
    </div>
    <div>
      <h2>ใช้รูปเสื้อของคุณเอง</h2>
      <label class="btn"><input type="file" id="file" accept="image/png,image/webp"><span>อัปโหลด PNG พื้นหลังโปร่งใส</span></label>
      <button id="clear" style="margin-top:8px">กลับไปใช้เสื้อแบบวาด</button>
    </div>
    <button id="maskbtn" aria-pressed="true">ตัดเสื้อตามรูปร่างตัว</button>
    <button id="shot">บันทึกภาพ</button>
    <small>ภาพจากกล้องประมวลผลในเครื่องคุณ ไม่ถูกอัปโหลดไปที่ไหน</small>
  </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const oc=document.createElement('canvas'), octx=oc.getContext('2d');
const video=document.createElement('video'); video.playsInline=true; video.muted=true;
const msg=document.getElementById('msg');
let style='tee', color='#c0392b', userImg=null, maskOn=true, sm={};

const styleNames={tee:'เสื้อยืด', long:'แขนยาว', tank:'เสื้อกล้าม'};
const colors=['#c0392b','#2f5d8a','#1e8449','#f1c40f','#ffffff','#1c1c1c','#8e44ad'];
const stylesEl=document.getElementById('styles'), colorsEl=document.getElementById('colors');
Object.keys(styleNames).forEach(k=>{
  const b=document.createElement('button'); b.textContent=styleNames[k]; b.setAttribute('aria-pressed',k===style);
  b.onclick=()=>{style=k;userImg=null;[...stylesEl.children].forEach(x=>x.setAttribute('aria-pressed',x===b))};
  stylesEl.appendChild(b);
});
colors.forEach(c=>{
  const b=document.createElement('button'); b.className='sw'; b.style.background=c; b.setAttribute('aria-label','สี '+c); b.setAttribute('aria-pressed',c===color);
  b.onclick=()=>{color=c;[...colorsEl.children].forEach(x=>x.setAttribute('aria-pressed',x===b))};
  colorsEl.appendChild(b);
});
document.getElementById('file').onchange=e=>{const f=e.target.files[0]; if(!f)return; const i=new Image(); i.onload=()=>{userImg=i}; i.src=URL.createObjectURL(f)};
document.getElementById('clear').onclick=()=>{userImg=null};
document.getElementById('maskbtn').onclick=e=>{maskOn=!maskOn;e.target.setAttribute('aria-pressed',maskOn)};
document.getElementById('shot').onclick=()=>{const a=document.createElement('a'); a.download='tryon.png'; a.href=cv.toDataURL('image/png'); a.click()};

// ---------- เครื่องมือคำนวณ ----------
const sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y}), len=a=>Math.hypot(a.x,a.y), mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
const norm=a=>{const l=len(a)||1;return{x:a.x/l,y:a.y/l}}, dot=(a,b)=>a.x*b.x+a.y*b.y;
function smooth(name,raw){const o=sm[name]; return sm[name]=o?{x:o.x+(raw.x-o.x)*.5,y:o.y+(raw.y-o.y)*.5}:raw}
function smoothPath(pts){ // เส้นโค้งมนผ่านจุดต่างๆ ให้ขอบเสื้อนุ่มเหมือนผ้า
  const n=pts.length, m=i=>mid(pts[i],pts[(i+1)%n]), p=new Path2D(), s=m(n-1);
  p.moveTo(s.x,s.y);
  for(let i=0;i<n;i++){const e=m(i); p.quadraticCurveTo(pts[i].x,pts[i].y,e.x,e.y)}
  p.closePath(); return p;
}
function mirrored(c,img){c.save();c.translate(cv.width,0);c.scale(-1,1);c.drawImage(img,0,0,cv.width,cv.height);c.restore()}

// ---------- สร้างรูปเสื้อจากจุดจริงบนร่างกาย ----------
function build(S){
  const {SL,SR}=S, rv=norm(sub(SR,SL)), W=len(sub(SR,SL)), C=mid(SL,SR);
  let dv={x:-rv.y,y:rv.x}, H=W*1.3;
  if(S.hipOK){const t=sub(mid(S.HL,S.HR),C); H=len(t); dv=norm(t)}
  const at=(b,r,d)=>({x:b.x+rv.x*r+dv.x*d, y:b.y+rv.y*r+dv.y*d});
  const HL=S.hipOK?S.HL:at(SL,.12*W,H), HR=S.hipOK?S.HR:at(SR,-.12*W,H);
  const hmL=at(HL,-.1*W,.08*H), hmR=at(HR,.1*W,.08*H);
  const neckU=[at(C,.1*W,.07*H),at(C,0,.1*H),at(C,-.1*W,.07*H)];
  const NL=at(C,-.17*W,-.03*H), NR=at(C,.17*W,-.03*H);
  const AL=at(SL,.04*W,.27*H), AR=at(SR,-.04*W,.27*H);
  // แขนเสื้อตามแขนจริง: sign=-1 ซ้าย, +1 ขวา
  function sleeve(sh,el,wr,okE,okW,sign,wid){
    const outer=sign<0?-1:1;
    const a=okE?norm(sub(el,sh)):norm({x:rv.x*.3*outer+dv.x,y:rv.y*.3*outer+dv.y});
    const L1=okE?len(sub(el,sh)):.6*H;
    const E=okE?el:{x:sh.x+a.x*L1,y:sh.y+a.y*L1};
    const a2=okW?norm(sub(wr,E)):a, L2=okW?len(sub(wr,E)):L1*.9;
    const Wr=okW?wr:{x:E.x+a2.x*L2,y:E.y+a2.y*L2};
    const side=(c,dir,w)=>{let p={x:-dir.y,y:dir.x}; if(dot(p,rv)*outer<0)p={x:-p.x,y:-p.y}; return [{x:c.x+p.x*w,y:c.y+p.y*w},{x:c.x-p.x*w,y:c.y-p.y*w}]};
    if(style==='long'){const e=side(E,a,wid*1.1), w=side(Wr,a2,wid*.85); return {out:[e[0],w[0]],inn:[w[1],e[1]]}}
    const m={x:sh.x+a.x*L1*.5,y:sh.y+a.y*L1*.5}, e=side(m,a,wid); return {out:[e[0]],inn:[e[1]]};
  }
  let pts;
  if(style==='tank'){
    pts=[at(SL,.0*W,-.02*H),at(SL,.06*W,.24*H),hmL,hmR,at(SR,-.06*W,.24*H),at(SR,0,-.02*H),at(SR,-.14*W,-.02*H),at(C,.1*W,.12*H),at(C,0,.17*H),at(C,-.1*W,.12*H),at(SL,.14*W,-.02*H)];
  } else {
    const sl=sleeve(SL,S.EL,S.WL,S.elbowOK,S.wristOK,-1,.11*W), sr=sleeve(SR,S.ER,S.WR,S.elbowOK,S.wristOK,1,.11*W);
    pts=[NL,at(SL,-.1*W,-.02*H),...sl.out,...sl.inn,AL,hmL,hmR,AR,...sr.inn.slice().reverse(),...sr.out.slice().reverse(),at(SR,.1*W,-.02*H),NR,...neckU];
  }
  return {pts,W,H,C,dv,neckU:[NR,...neckU,NL],ang:Math.atan2(SR.y-SL.y,SR.x-SL.x)};
}

function onResults(r){
  const w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h); mirrored(ctx,video);
  const L=r.poseLandmarks;
  if(!L||L[11].visibility<.5||L[12].visibility<.5){msg.style.display='flex';msg.textContent='ยังไม่เห็นไหล่ ขยับถอยหลังให้เห็นลำตัวท่อนบน';sm={};return}
  msg.style.display='none';
  const P=i=>({x:(1-L[i].x)*w,y:L[i].y*h}), V=i=>L[i].visibility;
  const lf=P(11).x<=P(12).x, o=lf?[0,1]:[1,0];
  const id=(a,b)=>[a,b][o[0]===0?0:1], pick=(a,b)=>lf?[a,b]:[b,a];
  const [s0,s1]=pick(11,12),[e0,e1]=pick(13,14),[w0,w1]=pick(15,16),[h0,h1]=pick(23,24);
  const S={SL:smooth('SL',P(s0)),SR:smooth('SR',P(s1)),EL:smooth('EL',P(e0)),ER:smooth('ER',P(e1)),WL:smooth('WL',P(w0)),WR:smooth('WR',P(w1)),HL:smooth('HL',P(h0)),HR:smooth('HR',P(h1))};
  S.hipOK=V(23)>.5&&V(24)>.5; S.elbowOK=V(13)>.5&&V(14)>.5; S.wristOK=V(15)>.5&&V(16)>.5;
  const g=build(S);

  octx.clearRect(0,0,w,h); octx.save();
  if(userImg){
    octx.translate(g.C.x,g.C.y); octx.rotate(g.ang);
    const iw=g.W*1.75, ih=iw*userImg.height/userImg.width; octx.drawImage(userImg,-iw/2,-g.H*.12,iw,ih);
  } else {
    const path=smoothPath(g.pts);
    octx.fillStyle=color; octx.fill(path);
    octx.save(); octx.clip(path);
    octx.globalCompositeOperation='overlay'; octx.globalAlpha=.55; mirrored(octx,video); // เอาแสงเงาจริงจากตัวคุณมาใส่ผ้า
    octx.globalAlpha=1; octx.globalCompositeOperation='source-over';
    const gr=octx.createLinearGradient(g.C.x,g.C.y,g.C.x+g.dv.x*g.H,g.C.y+g.dv.y*g.H);
    gr.addColorStop(0,'rgba(255,255,255,.08)'); gr.addColorStop(1,'rgba(0,0,0,.22)');
    octx.fillStyle=gr; octx.fillRect(0,0,w,h); octx.restore();
    if(style!=='tank'){octx.strokeStyle='rgba(0,0,0,.28)';octx.lineWidth=Math.max(2,g.W*.03);octx.lineCap='round';octx.lineJoin='round';
      octx.beginPath(); g.neckU.forEach((p,i)=>i?octx.lineTo(p.x,p.y):octx.moveTo(p.x,p.y)); octx.stroke()}
  }
  octx.restore();
  if(maskOn&&r.segmentationMask){octx.globalCompositeOperation='destination-in'; mirrored(octx,r.segmentationMask); octx.globalCompositeOperation='source-over'}
  ctx.drawImage(oc,0,0);
}

document.getElementById('start').onclick=async()=>{
  const btn=document.getElementById('start'); btn.disabled=true; msg.textContent='กำลังเปิดกล้องและโหลดโมเดล…';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:960,height:720,facingMode:'user'},audio:false});
    video.srcObject=stream; await video.play();
    cv.width=oc.width=video.videoWidth||960; cv.height=oc.height=video.videoHeight||720;
    const pose=new Pose({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${f}`});
    pose.setOptions({modelComplexity:1,smoothLandmarks:true,enableSegmentation:true,smoothSegmentation:true,minDetectionConfidence:.5,minTrackingConfidence:.5});
    pose.onResults(onResults);
    const loop=async()=>{if(video.readyState>=2)await pose.send({image:video});requestAnimationFrame(loop)};
    loop(); btn.textContent='กล้องทำงานอยู่';
  }catch(e){msg.textContent='เปิดกล้องไม่ได้: กรุณาอนุญาตการใช้กล้อง และเปิดหน้านี้ผ่าน https หรือ localhost'; btn.disabled=false}
};
</script>
</body>
</html>
